# Local stack. Each checkout gets its own project name and ports from .env
# (written by scripts/worktree-env.sh); the defaults below apply without one.
# Ports are published on localhost only.

# herald-api's image and configuration, shared by its migrate step.
x-herald-api: &herald-api
  build:
    context: .
    args:
      CMD: herald-api
  environment:
    HERALD_DATABASE_URL: postgres://herald:herald@postgres:5432/herald?sslmode=disable

# herald-dispatcher's image and configuration, shared by its migrate step.
x-herald-dispatcher: &herald-dispatcher
  build:
    context: .
    args:
      CMD: herald-dispatcher
  environment:
    HERALD_DATABASE_URL: postgres://herald:herald@postgres:5432/herald?sslmode=disable
    HERALD_NATS_URL: nats://nats:4222

services:
  # Each service's migrate step applies its schema's migrations and exits.
  # The service starts only after it succeeds; it never migrates on its own.
  api-migrate:
    <<: *herald-api
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  herald-api:
    <<: *herald-api
    environment:
      HERALD_DATABASE_URL: postgres://herald:herald@postgres:5432/herald?sslmode=disable
      # A key for the local stack only. It is public, so nothing it encrypts
      # is secret. herald-dispatcher decrypts with the same keyring.
      HERALD_KEYRING: &keyring local:ioEj3L2kOoSLD5CgHhOxHIJpq/rigH1TSXUCJaDZFRs=
      HERALD_NATS_URL: nats://nats:4222
      # Local Endpoints are on private addresses without TLS. Never set
      # outside local development.
      HERALD_ALLOW_INSECURE_ENDPOINTS: "true"
      # pprof, for make profile. Internal: never a Tenant-facing port.
      HERALD_PPROF_ADDR: &pprof-addr ":6060"
    ports:
      - "127.0.0.1:${HERALD_API_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${HERALD_API_GRPC_PORT:-9090}:9090"
      - "127.0.0.1:${HERALD_API_PPROF_PORT:-6060}:6060"
    depends_on:
      api-migrate:
        condition: service_completed_successfully

  dispatcher-migrate:
    <<: *herald-dispatcher
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  herald-dispatcher:
    <<: *herald-dispatcher
    environment:
      HERALD_DATABASE_URL: postgres://herald:herald@postgres:5432/herald?sslmode=disable
      # herald-api's keyring: the dispatcher decrypts what herald-api
      # encrypts.
      HERALD_KEYRING: *keyring
      HERALD_NATS_URL: nats://nats:4222
      # As for herald-api.
      HERALD_ALLOW_INSECURE_ENDPOINTS: "true"
      # The retry schedule in about 80 seconds rather than 24 hours, so a
      # failing Endpoint is retried, and given up on, while you watch, and
      # the end-to-end tests finish in under two minutes.
      HERALD_RETRY_SCALE: "0.001"
      # As for herald-api.
      HERALD_PPROF_ADDR: *pprof-addr
    ports:
      - "127.0.0.1:${HERALD_DISPATCHER_PPROF_PORT:-6061}:6060"
    # The end-to-end tests serve their Endpoints from the host. Docker
    # Desktop defines this name already; on Linux it needs mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      dispatcher-migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: herald
      POSTGRES_PASSWORD: herald
      POSTGRES_DB: herald
    ports:
      - "127.0.0.1:${HERALD_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      # Check over TCP: during first-run initialisation the image runs a
      # temporary server on the Unix socket only, which must not count as ready.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "herald", "-d", "herald"]
      interval: 2s
      timeout: 5s
      retries: 15

  nats:
    image: nats:2.12-alpine
    command: ["--http_port", "8222"]
    ports:
      - "127.0.0.1:${HERALD_NATS_PORT:-4222}:4222"
      - "127.0.0.1:${HERALD_NATS_MONITOR_PORT:-8222}:8222"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Receives spans over OTLP and writes them to ClickHouse.
  otelcol:
    build: deploy/otelcol
    # Services in the stack reach it on the compose network; this port is
    # for spans sent from the host, as the end-to-end tests do.
    ports:
      - "127.0.0.1:${HERALD_OTLP_HTTP_PORT:-4318}:4318"
    healthcheck:
      test: ["CMD", "/bin/wget", "-q", "-O", "/dev/null", "http://localhost:13133/"]
      interval: 2s
      timeout: 5s
      retries: 15
    depends_on:
      clickhouse:
        condition: service_healthy

  # The telemetry store: one row per span, queried with SQL over HTTP. The
  # Collector creates its tables.
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.40.7-alpine
    environment:
      CLICKHOUSE_USER: herald
      CLICKHOUSE_PASSWORD: herald
    ports:
      - "127.0.0.1:${HERALD_CLICKHOUSE_HTTP_PORT:-8123}:8123"
    volumes:
      - clickhouse:/var/lib/clickhouse
    # ClickHouse's recommended open-file limit.
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8123/ping"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres:
  clickhouse:
