# Local stack. Each checkout gets its own project name and ports from .env
# (written by scripts/worktree-env.sh); the defaults below apply without one.
# Ports are published on localhost only.

# herald-api's image and configuration, shared by its migrate step.
x-herald-api: &herald-api
  build:
    context: .
    args:
      CMD: herald-api
  environment:
    HERALD_DATABASE_URL: postgres://herald:herald@postgres:5432/herald?sslmode=disable

# herald-dispatcher's image and configuration, shared by its migrate step.
x-herald-dispatcher: &herald-dispatcher
  build:
    context: .
    args:
      CMD: herald-dispatcher
  environment:
    HERALD_DATABASE_URL: postgres://herald:herald@postgres:5432/herald?sslmode=disable
    HERALD_NATS_URL: nats://nats:4222

services:
  # Each service's migrate step applies its schema's migrations and exits.
  # The service starts only after it succeeds; it never migrates on its own.
  api-migrate:
    <<: *herald-api
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  herald-api:
    <<: *herald-api
    environment:
      HERALD_DATABASE_URL: postgres://herald:herald@postgres:5432/herald?sslmode=disable
      # A key for the local stack only. It is public, so nothing it encrypts
      # is secret.
      HERALD_KEYRING: local:ioEj3L2kOoSLD5CgHhOxHIJpq/rigH1TSXUCJaDZFRs=
    ports:
      - "127.0.0.1:${HERALD_API_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${HERALD_API_GRPC_PORT:-9090}:9090"
    depends_on:
      api-migrate:
        condition: service_completed_successfully

  dispatcher-migrate:
    <<: *herald-dispatcher
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  herald-dispatcher:
    <<: *herald-dispatcher
    depends_on:
      dispatcher-migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: herald
      POSTGRES_PASSWORD: herald
      POSTGRES_DB: herald
    ports:
      - "127.0.0.1:${HERALD_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      # Check over TCP: during first-run initialisation the image runs a
      # temporary server on the Unix socket only, which must not count as ready.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "herald", "-d", "herald"]
      interval: 2s
      timeout: 5s
      retries: 15

  nats:
    image: nats:2.12-alpine
    command: ["--http_port", "8222"]
    ports:
      - "127.0.0.1:${HERALD_NATS_PORT:-4222}:4222"
      - "127.0.0.1:${HERALD_NATS_MONITOR_PORT:-8222}:8222"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres:
