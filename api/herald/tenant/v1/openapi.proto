syntax = "proto3";

package herald.tenant.v1;

import "protoc-gen-openapiv2/options/annotations.proto";

// What the generated OpenAPI spec says about the Tenant API as a whole.
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Herald Tenant API"
    version: "v1"
  }
  security_definitions: {
    security: {
      key: "ApiKey"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "One of the Tenant's API keys, as \"Bearer <key>\"."
      }
    }
  }
  security: {
    security_requirement: {
      key: "ApiKey"
      value: {}
    }
  }
};
