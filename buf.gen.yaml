version: v2
# Managed mode sets go_package, so the .proto files carry no Go-specific options.
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/madskrogh/herald/internal/gen
plugins:
  # The protoc-gen-go version is pinned in go.mod as a tool, so it always
  # matches the protobuf runtime the generated code imports.
  - local: ["go", "tool", "protoc-gen-go"]
    out: internal/gen
    opt: paths=source_relative
# Deletes internal/gen before generating, so code for a removed .proto file
# doesn't linger.
clean: true
