version: v2
# The Tenant API's OpenAPI spec, generated from the api module alone: a
# merged spec takes its title and description from the first file it reads,
# and nothing from the internal handoff package belongs in public docs.
# The plugin needs a go_package even though it writes no Go, so managed mode
# is set up as in buf.gen.yaml.
managed:
  enabled: true
  disable:
    - module: buf.build/googleapis/googleapis
      file_option: go_package
    - module: buf.build/grpc-ecosystem/grpc-gateway
      file_option: go_package
  override:
    - file_option: go_package_prefix
      value: github.com/madskrogh/herald/internal/gen
inputs:
  - directory: .
    paths:
      - api/herald/tenant
plugins:
  # Its version is pinned in go.mod as a tool, like the other plugins.
  - local: ["go", "tool", "protoc-gen-openapiv2"]
    out: docs/openapi
    # Merging needs every file in one run, not a run per directory.
    strategy: all
    opt:
      - allow_merge=true
      - merge_file_name=tenant
clean: true
