version: "2"
sql:
  - engine: postgresql
    schema: internal/ingest/migrations
    queries: internal/ingest/queries.sql
    gen:
      go:
        package: ingestdb
        out: internal/ingest/ingestdb
        sql_package: pgx/v5
        # Go initialisms, so that rows convert to the ingest package's types.
        rename:
          url: URL
        overrides:
          - db_type: uuid
            go_type:
              import: uuid
              type: UUID
          - db_type: timestamptz
            go_type:
              import: time
              type: Time
  - engine: postgresql
    schema: internal/delivery/migrations
    queries: internal/delivery/queries.sql
    gen:
      go:
        package: deliverydb
        out: internal/delivery/deliverydb
        sql_package: pgx/v5
        rename:
          url: URL
          endpoint_url: EndpointURL
        overrides:
          - db_type: uuid
            go_type:
              import: uuid
              type: UUID
          - db_type: timestamptz
            go_type:
              import: time
              type: Time
