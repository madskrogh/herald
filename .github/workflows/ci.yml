name: CI

# On every PR, and again on main after each merge: two PRs can each pass on
# their own and still break main together.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels that PR's older run. Every push to main has a
# group of its own, so each merge is tested.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Two commits, so HEAD^1 is there for `buf breaking` to compare with.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Installs golangci-lint only; `make ci` runs it, so CI and a local
      # `make ci` run the same commands.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true

      # `make ci` regenerates the sqlc code and fails if it changed. The
      # version is in every generated file's header, so it must match the
      # version the committed code was generated with.
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: 1.30.0

      # Installs buf only; `make ci` runs lint, breaking and generate. Pinned
      # so its lint and breaking rules don't change under a PR.
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.59.0
          setup_only: true

      # Protos are compared with HEAD^1. On a PR, HEAD is the merge commit and
      # HEAD^1 the main it was made from; on main, merges are squashed, so
      # HEAD^1 is main before this merge.
      - run: make ci AGAINST=HEAD^1
