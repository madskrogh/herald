name: CI

# On every PR, and again on main after each merge: two PRs can each pass on
# their own and still break main together.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels that PR's older run. Every push to main has a
# group of its own, so each merge is tested.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Two commits, so HEAD^1 is there for `buf breaking` to compare with.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Installs golangci-lint only; `make ci` runs it, so CI and a local
      # `make ci` run the same commands.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true

      # `make ci` regenerates the sqlc code and fails if it changed. The
      # version is in every generated file's header, so it must match the
      # version the committed code was generated with.
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: 1.30.0

      # Installs buf only; `make ci` runs lint, breaking and generate. Pinned
      # so its lint and breaking rules don't change under a PR.
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.59.0
          setup_only: true

      # Protos are compared with HEAD^1. On a PR, HEAD is the merge commit and
      # HEAD^1 the main it was made from; on main, merges are squashed, so
      # HEAD^1 is main before this merge.
      - run: make ci AGAINST=HEAD^1

  # Fails a PR that changes a check file together with any other file, and
  # lists both: whoever changes behaviour must not also change what judges
  # it (docs/testing.md, "Check changes"). Only on PRs: on main, the change
  # has merged. It runs the script, not a make target, so a change outside
  # the check files can't switch it off.
  checks-apart:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Two commits, so HEAD^1 is there: the main the PR's merge commit was
      # made from, so the merge commit's change is the PR's.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - run: scripts/checks-apart.sh HEAD^1

  # Builds each binary's image, so a change that breaks one fails its PR.
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cmd: [herald-api, herald-dispatcher, herald-admin]
    steps:
      - uses: actions/checkout@v7
      - run: docker build --build-arg CMD=${{ matrix.cmd }} .

  # The end-to-end suite against the compose stack. Locally, it is `make up`
  # then `make e2e`.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: make up
      - run: make e2e

      # The services' logs say why a Delivery didn't arrive.
      - if: failure()
        run: docker compose logs

      - if: always()
        run: make down

  # The behaviour comparison and the scenario invariants on this build's
  # stack, with the base build's stack running the scenario beside it, on
  # the same runner at the same time, for the timing comparison
  # (docs/testing.md). Locally, it is `make up` in this checkout and the
  # base's, then `make scenario-timing BASE=<checkout>`.
  # The job takes about five minutes. It is stopped after 30, rather than
  # GitHub's six hours, should a stack hang. A job stopped that way skips
  # the steps that save the logs, so the limit leaves time to start both
  # stacks, for the test's own 20-minute timeout to fail the run first, and
  # for those steps.
  scenario:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OUT: scenario-timing/ci
    steps:
      # Two commits, so HEAD^1 is there to be the base: on a PR, the main
      # the merge commit was made from; on main, main before this merge.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: git worktree add --detach "$RUNNER_TEMP/base" HEAD^1

      # Each build's spans say which build and run they are from.
      - name: Start both stacks
        run: |
          HERALD_BUILD_VERSION=$(git -C "$RUNNER_TEMP/base" rev-parse --short HEAD) \
            HERALD_RUN_ID=base make -C "$RUNNER_TEMP/base" up
          HERALD_BUILD_VERSION=$(git rev-parse --short HEAD) HERALD_RUN_ID=candidate make up

      - run: make scenario-timing BASE="$RUNNER_TEMP/base"

      # The report on the run's page, so a reviewer reads it without
      # downloading anything.
      - if: always()
        run: cat "$OUT/report.md" >>"$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      # The services' logs say why a Delivery didn't arrive.
      - if: failure()
        run: |
          mkdir -p "$OUT"
          docker compose logs >"$OUT/candidate-services.log" 2>&1 || true
          (cd "$RUNNER_TEMP/base" && docker compose logs) >"$OUT/base-services.log" 2>&1 || true

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: scenario
          path: ${{ env.OUT }}
          if-no-files-found: ignore
